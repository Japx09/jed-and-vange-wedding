<section id="wedding-gifts-section" class="relative z-20 w-full px-4 sm:px-6 md:px-12 py-12 md:py-20" style="background-color: var(--template-page-background, #fcf7ed); scroll-margin-top: 80px;">
  <div class="max-w-4xl mx-auto rounded-[28px] sm:rounded-[36px] px-6 py-14 sm:py-20 md:px-16 text-center shadow-2xl relative overflow-hidden" style="background-color: #34372c; color: #fffaf1; box-shadow: 0 20px 60px rgba(47, 36, 27, 0.16);">
    
    <!-- Subtle ambient warm glow -->
    <div class="pointer-events-none absolute -top-28 left-1/2 -translate-x-1/2 w-[420px] h-[420px] rounded-full opacity-20 blur-3xl" style="background-color: #d6c5b0;"></div>

    <!-- Category Kicker -->
    <p class="text-xs sm:text-[13px] uppercase tracking-[0.25em] font-medium opacity-75 mb-3" style="color: #ded6cc;">
      Wedding Gifts
    </p>

    <!-- Heading -->
    <h2 class="text-3xl sm:text-4xl md:text-5xl font-normal tracking-tight mb-4 leading-tight" style="font-family: var(--template-font-display-stack, serif); color: #fffaf1;">
      Your presence is our greatest gift
    </h2>

    <!-- Subtitle / Note -->
    <p class="text-sm sm:text-base max-w-xl mx-auto leading-relaxed opacity-85 mb-8 sm:mb-10" style="color: #ded6cc; font-family: var(--template-font-body-stack, sans-serif);">
      If you wish to give us something, we will graciously accept a contribution to our newlywed fund.
    </p>

    <!-- QR Code Card -->
    <div class="inline-block mx-auto mb-8 sm:mb-10">
      <div class="p-4 sm:p-5 bg-white rounded-3xl shadow-2xl transition-transform hover:scale-[1.02] duration-300 max-w-[260px] sm:max-w-[290px] mx-auto border" style="border-color: rgba(255, 255, 255, 0.2);">
        <img 
          src="/qr.jpg" 
          alt="InstaPay QR Code for Jed &amp; Vanj" 
          class="w-full h-auto rounded-2xl block" 
          loading="lazy"
          style="display: block; width: 100%; height: auto;"
        />
      </div>
    </div>

    <!-- Bank Details & Message note -->
    <div class="pt-2 flex items-center justify-center gap-2.5 sm:gap-3 flex-wrap text-xs sm:text-sm tracking-wide opacity-95" style="color: #ded6cc;">
      <span class="inline-flex items-center gap-1.5">
        <span class="opacity-80">Swift Code:</span>
        <strong class="font-semibold text-white tracking-widest font-mono text-xs sm:text-sm bg-white/10 px-2 py-0.5 rounded">CHBKPHMM</strong>
      </span>
      <span class="text-[#e29388] text-sm" aria-hidden="true">❤</span>
      <span class="inline-flex items-center gap-1.5">
        <span class="opacity-80">Message:</span>
        <strong class="font-semibold text-white italic">“HoneyMoon”</strong>
      </span>
    </div>

  </div>
</section>
