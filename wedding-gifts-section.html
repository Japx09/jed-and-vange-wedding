<section id="wedding-gifts-section" class="wedding-gifts-wrapper">
  <style>
    .wedding-gifts-wrapper {
      position: relative;
      z-index: 20;
      width: 100%;
      padding: 48px 16px;
      background-color: var(--template-page-background, #fcf7ed);
      scroll-margin-top: 80px;
      box-sizing: border-box;
    }
    @media (min-width: 768px) {
      .wedding-gifts-wrapper {
        padding: 80px 24px;
      }
    }
    .wedding-gifts-card {
      max-width: 840px;
      margin: 0 auto;
      border-radius: 28px;
      padding: 48px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background-color: #34372c;
      color: #fffaf1;
      box-shadow: 0 20px 60px rgba(47, 36, 27, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-sizing: border-box;
    }
    @media (min-width: 640px) {
      .wedding-gifts-card {
        border-radius: 36px;
        padding: 60px 40px;
      }
    }
    @media (min-width: 768px) {
      .wedding-gifts-card {
        padding: 72px 56px;
      }
    }
    .wedding-gifts-glow {
      pointer-events: none;
      position: absolute;
      top: -120px;
      left: 50%;
      transform: translateX(-50%);
      width: 440px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(214, 197, 176, 0.22) 0%, rgba(52, 55, 44, 0) 70%);
    }
    .wedding-gifts-kicker {
      font-size: 12px;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      font-weight: 500;
      color: #ded6cc;
      opacity: 0.8;
      margin: 0 0 12px 0;
      font-family: var(--template-font-body-stack, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
    }
    .wedding-gifts-title {
      font-family: var(--template-font-display-stack, "Playfair Display", Georgia, serif);
      font-size: clamp(1.75rem, 4vw, 2.75rem);
      font-weight: 400;
      line-height: 1.25;
      color: #fffaf1;
      margin: 0 0 16px 0;
      letter-spacing: -0.01em;
    }
    .wedding-gifts-desc {
      font-family: var(--template-font-body-stack, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      font-size: clamp(0.9rem, 2vw, 1.05rem);
      line-height: 1.6;
      color: #ded6cc;
      max-width: 580px;
      margin: 0 auto 32px auto;
      opacity: 0.9;
    }
    @media (min-width: 640px) {
      .wedding-gifts-desc {
        margin-bottom: 40px;
      }
    }
    .wedding-gifts-qr-box {
      display: inline-block;
      margin: 0 auto 32px auto;
      background: #ffffff;
      padding: 16px;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.24);
      border: 1px solid rgba(255, 255, 255, 0.3);
      max-width: 250px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-sizing: border-box;
    }
    @media (min-width: 640px) {
      .wedding-gifts-qr-box {
        padding: 20px;
        max-width: 280px;
        border-radius: 28px;
        margin-bottom: 40px;
      }
    }
    .wedding-gifts-qr-box:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 20px 48px rgba(0, 0, 0, 0.3);
    }
    .wedding-gifts-qr-img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px;
    }
    @media (min-width: 640px) {
      .wedding-gifts-qr-img {
        border-radius: 16px;
      }
    }
    .wedding-gifts-details {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: clamp(0.82rem, 2vw, 0.95rem);
      color: #ded6cc;
      font-family: var(--template-font-body-stack, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
      margin-top: 4px;
    }
    .wedding-gifts-swift-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.08em;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 3px 8px;
      border-radius: 6px;
    }
    .wedding-gifts-msg-val {
      font-weight: 600;
      color: #ffffff;
      font-style: italic;
    }
    .wedding-gifts-heart {
      color: #e29388;
      font-size: 14px;
      user-select: none;
    }
  </style>

  <div class="wedding-gifts-card">
    <div class="wedding-gifts-glow"></div>

    <p class="wedding-gifts-kicker">Wedding Gifts</p>

    <h2 class="wedding-gifts-title">Your presence is our greatest gift</h2>

    <p class="wedding-gifts-desc">
      If you wish to give us something, we will graciously accept a contribution to our newlywed fund.
    </p>

    <div class="wedding-gifts-qr-box">
      <img
        src="/qr.jpg"
        alt="InstaPay QR Code for Jed &amp; Vanj"
        class="wedding-gifts-qr-img"
        loading="lazy"
      />
    </div>

    <div class="wedding-gifts-details">
      <span>
        <span style="opacity: 0.85;">Swift Code:</span>
        <strong class="wedding-gifts-swift-code">CHBKPHMM</strong>
      </span>
      <span class="wedding-gifts-heart" aria-hidden="true">❤</span>
      <span>
        <span style="opacity: 0.85;">Message:</span>
        <strong class="wedding-gifts-msg-val">“HoneyMoon”</strong>
      </span>
    </div>
  </div>
</section>
